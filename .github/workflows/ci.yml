name: CI Gates

on:
  pull_request:
    branches: [main]

jobs:
  bundle-size:
    name: Bundle Size Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Build
        run: npx nuxt build

      - name: Check bundle size
        run: |
          # Measure the worker bundle from nuxt build output (dist/_worker.js/)
          TOTAL_SIZE=$(find dist/_worker.js -name '*.mjs' -o -name '*.js' | xargs cat | wc -c)
          GZIP_SIZE=$(find dist/_worker.js -name '*.mjs' -o -name '*.js' | xargs cat | gzip -c | wc -c)
          GZIP_MB=$(echo "scale=2; $GZIP_SIZE / 1048576" | bc)
          echo "Worker bundle gzip size: ${GZIP_MB}MB ($GZIP_SIZE bytes)"
          # Fail if gzip > 3MB
          if [ "$GZIP_SIZE" -gt 3145728 ]; then
            echo "::error::Bundle size ${GZIP_MB}MB exceeds 3MB limit"
            exit 1
          fi
          echo "Bundle size OK: ${GZIP_MB}MB"

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Install Chrome
        run: npx playwright install --with-deps chromium

      - name: Run Lighthouse CI
        run: npx lhci autorun --collect.url="https://remix-recipe.com/" --collect.url="https://remix-recipe.com/recipe/thai-italian-pasta" --collect.startServerCommand="" --collect.numberOfRuns=1
