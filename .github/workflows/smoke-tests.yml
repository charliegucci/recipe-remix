name: Smoke Tests (Production)

on:
  workflow_run:
    workflows: ["Deploy to Production"]
    types:
      - completed

  # Allow manual trigger
  workflow_dispatch:
    inputs:
      test_url:
        description: 'URL to test (defaults to production)'
        required: false
        type: string

jobs:
  smoke-tests:
    name: Run Smoke Tests
    runs-on: ubuntu-latest

    # Only run if deploy succeeded OR manual trigger
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Run smoke tests
        env:
          TEST_URL: ${{ inputs.test_url || secrets.PRODUCTION_URL }}
        run: npm run test:smoke

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Comment test results on latest commit
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const commit_sha = context.payload.workflow_run?.head_sha || context.sha;
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commit_sha,
              body: '⚠️ **Smoke tests failed after deployment**\n\nCheck the [workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            });
